<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The platform now lives on the official GOSIM domain; the personal address only forwards.
      if (window.location.hostname === 'bh3gei.github.io') {
        const rest = window.location.pathname.replace(/^\/agent-observer\/?/, '')
        window.location.replace('https://create.gosim.org/survey26/platform/' + rest + window.location.search + window.location.hash)
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico" />
    <meta name="theme-color" content="#05070d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>巡天智能体 · Agent Observer</title>
    <meta name="description" content="GOSIM 智能巡天黑客松：为天文台写一个观测智能体——它看得到公开的天空状态，却看不到真实天气，每 15 分钟决定下一步拍哪片天。" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      try {
        const redirect = window.sessionStorage.getItem('gosim-pages-redirect')
        const eventBase = '%BASE_URL%'
        if (redirect) {
          const target = new URL(redirect, window.location.origin)
          if (target.origin === window.location.origin && target.pathname.startsWith(eventBase)) {
            window.sessionStorage.removeItem('gosim-pages-redirect')
            window.history.replaceState(null, '', target.pathname + target.search + target.hash)
          }
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
