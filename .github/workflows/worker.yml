name: Evaluation worker

# Runs the Python evaluation worker on a GitHub-hosted runner: claims queued submissions from Supabase,
# executes agent packages in a sandbox against the hidden scenarios, scores them and writes results back.
# Public repositories get unlimited Actions minutes, so this needs no server of its own.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: evaluation-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Process the queue until it is empty
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAC_WORKER_ID: gha-${{ github.run_id }}
          SAC_WORKER_KINDS: agent,results
          # challenge v3: the wall clock comes from each scenario (global_wallclock_seconds); these cap the rest
          SAC_AGENT_INIT_TIMEOUT_SECONDS: "30"
          SAC_INSTALL_TIMEOUT_SECONDS: "900"
          SAC_AGENT_CPU_SECONDS: "7200"
          SAC_AGENT_MEMORY_MB: "2048"
          SAC_AGENT_NETWORK: "all"
          SAC_DATA_DIR: ${{ runner.temp }}/sac
        run: python -m worker.main once
